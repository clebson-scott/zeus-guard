name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  risk-engine-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install engine deps
        run: pip install -q -r requirements.txt
      - name: Run QCSN synthetic benchmark (40/40)
        run: python3 engine/demo.py
      - name: Honesty experiment (quench vs argmin, 0 divergences)
        run: python3 engine/honesty_experiment.py
      - name: Real data benchmark (100% recall, 11.9% FP)
        run: python3 engine/realdata_benchmark.py
      - name: Engine invariant tests (5/5 pass)
        run: python3 engine/test_engine_invariants.py
      - name: INV9 receiver-match tests (33/33 pass)
        run: python3 engine/test_inv9.py
      - name: Label resolver tests (17/17 pass)
        run: python3 engine/test_label_resolver.py
      - name: Temporal split benchmark (recall 100% both halves)
        run: python3 engine/realdata_benchmark_temporal.py
      - name: Ground-truth corrected benchmark (54 true attacks, recall 100%)
        run: python3 engine/realdata_benchmark_gt_corrected.py

  extension-qa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extension JS Test Harness (10/10 pass)
        run: node ext/test_extension.js

  stylus-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeus-guard-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus-guard-contract
      - name: Native unit tests (15/15 pass)
        run: cargo test --quiet
      - name: WASM target builds (Stylus artifact)
        run: cargo build --target wasm32-unknown-unknown --release --quiet
