name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  risk-engine-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run QCSN benchmark (expect 40/40)
        run: python3 engine/demo.py

  stylus-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeus-guard-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus-guard-contract
      - name: Native unit tests
        run: cargo test --quiet
